# Nova — Render Blueprint (one click: Render dashboard -> New -> Blueprint -> this repository).
# Creates: nova-api (Django), nova-web (static site), nova-db (PostgreSQL). All on FREE plans.
#
# Free-plan facts (render.com/docs/free, read 2026-11-15):
#  - nova-api sleeps after 15 min without traffic; the next request takes ~1 minute (the app shows
#    a "server waking up" notice meanwhile). For judging without sleep, change nova-api to
#    plan: starter (paid) in the dashboard.
#  - no persistent disk on free: the 2 MB MOLA demo DEM is re-downloaded from NASA PDS (MD5
#    checked) at every start by bootstrap_demo_data; finer DEMs are read remotely anyway.
#  - free PostgreSQL expires 30 days after creation (then 14 days grace).
#
# If Render had to rename a service because the name was taken (e.g. nova-api-abcd), update the
# three URL values below (ALLOWED_HOSTS, FRONTEND_ORIGIN/CSRF_TRUSTED_ORIGINS, VITE_API_BASE_URL)
# in the dashboard and redeploy.
services:
  - type: web
    name: nova-api
    runtime: python
    plan: free
    rootDir: mars-explorer/backend
    buildCommand: pip install -r requirements-prod.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_demo_data && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WRITE_API_TOKEN
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: nova-api.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://nova-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nova-web.onrender.com,https://nova-api.onrender.com
      - key: PUBLIC_READ_ONLY
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: MARS_DATA_DIR
        value: /opt/render/project/src/mars-explorer/data/mars
      - key: AI_PROVIDER
        value: rules
      - key: DATABASE_URL
        fromDatabase:
          name: nova-db
          property: connectionString
  - type: web
    name: nova-web
    runtime: static
    rootDir: mars-explorer/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nova-api.onrender.com/api/v1
      - key: VITE_TREK_WMTS_BASE
        value: https://trek.nasa.gov/tiles/Mars/EQ
      - key: VITE_CESIUM_ION_TOKEN
        sync: false
databases:
  - name: nova-db
    plan: free
